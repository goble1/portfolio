name: Build and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies 📦
        run: npm ci

      - name: Build site 🏗️
        run: npm run build

      - name: Fix CSS paths 🔧
        run: |
          echo "Fixing CSS paths in HTML files..."
          # Create assets directory in root and each subdirectory
          mkdir -p dist/assets
          
          # Find all subdirectories in dist that contain HTML files
          SUBDIRS=$(find dist -type d -not -path "*/\.*" -not -path "*/assets" -not -path "*/node_modules*" | sort)
          echo "Found subdirectories: $SUBDIRS"
          
          # Copy all CSS from _astro directory if it exists
          if [ -d "dist/_astro" ]; then
            cp -r dist/_astro/* dist/assets/ || echo "No _astro files to copy"
          fi
          
          # Copy any CSS files in root to assets directory
          find dist -maxdepth 1 -name "*.css" -exec cp {} dist/assets/ \; || echo "No root CSS files to copy"
          
          # Find the actual CSS filename pattern in the build output
          CSS_FILE=$(find dist/assets -name "*.css" | head -n 1 | xargs basename 2>/dev/null || echo "_slug_.F5P_0dVk.css")
          echo "Found CSS file: $CSS_FILE"
          
          # Create assets directory in each subdirectory and copy CSS file
          for DIR in $SUBDIRS; do
            if [ -d "$DIR" ]; then
              echo "Creating assets directory in $DIR"
              mkdir -p "$DIR/assets"
              cp dist/assets/*.css "$DIR/assets/" || echo "Failed to copy CSS to $DIR/assets/"
            fi
          done
          
          # Fix CSS references in root HTML files
          find dist -maxdepth 1 -name "*.html" -exec sed -i 's|href="/_astro/[^"]*\.css"|href="./assets/'"$CSS_FILE"'"|g' {} \;
          find dist -maxdepth 1 -name "*.html" -exec sed -i 's|href="/_slug_[^"]*\.css"|href="./assets/'"$CSS_FILE"'"|g' {} \;
          
          # Fix CSS references in subdirectory HTML files
          for DIR in $SUBDIRS; do
            if [ -d "$DIR" ]; then
              echo "Fixing CSS references in $DIR"
              find "$DIR" -name "*.html" -exec sed -i 's|href="/_astro/[^"]*\.css"|href="./assets/'"$CSS_FILE"'"|g' {} \;
              find "$DIR" -name "*.html" -exec sed -i 's|href="/_slug_[^"]*\.css"|href="./assets/'"$CSS_FILE"'"|g' {} \;
              find "$DIR" -name "*.html" -exec sed -i 's|href="../_astro/[^"]*\.css"|href="./assets/'"$CSS_FILE"'"|g' {} \;
              find "$DIR" -name "*.html" -exec sed -i 's|href="../_slug_[^"]*\.css"|href="./assets/'"$CSS_FILE"'"|g' {} \;
            fi
          done
          
          # Debug info
          echo "CSS file distribution:"
          find dist -name "*.css" | sort
          
          echo "CSS references in HTML files:"
          find dist -name "*.html" -exec grep -l "stylesheet" {} \; | xargs grep "stylesheet" || echo "No stylesheet references found"
          
          echo "CSS path fix complete"

      - name: Add .nojekyll file
        run: |
          touch dist/.nojekyll
          echo "Added .nojekyll file to disable Jekyll processing"
          
      - name: Copy CNAME file
        run: |
          echo "craiggoble.com" > dist/CNAME
          echo "Added CNAME file for custom domain"
          
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder the action should deploy
          branch: gh-pages # The branch the action should deploy to
          clean: true # Automatically remove deleted files from the deployment branch