name: Build and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies 📦
        run: npm ci

      - name: Build site 🏗️
        run: npm run build

      - name: Fix CSS paths 🔧
        run: |
          echo "Fixing CSS paths in HTML files..."
          # Create assets directory in root and each subdirectory
          mkdir -p dist/assets
          
          # Find all subdirectories in dist that contain HTML files
          SUBDIRS=$(find dist -type d -not -path "*/\.*" -not -path "*/assets" -not -path "*/node_modules*" | sort)
          echo "Found subdirectories: $SUBDIRS"
          
          # Copy all CSS from _astro directory if it exists
          if [ -d "dist/_astro" ]; then
            cp -r dist/_astro/* dist/assets/ || echo "No _astro files to copy"
          fi
          
          # Copy any CSS files in root to assets directory
          find dist -maxdepth 1 -name "*.css" -exec cp {} dist/assets/ \; || echo "No root CSS files to copy"
          
          # Find all CSS files
          CSS_FILES=$(find dist/assets -name "*.css" | xargs -n1 basename 2>/dev/null)
          echo "Found CSS files: $CSS_FILES"
          
          # Create assets directory in each subdirectory and copy CSS files
          for DIR in $SUBDIRS; do
            if [ -d "$DIR" ]; then
              echo "Creating assets directory in $DIR"
              mkdir -p "$DIR/assets"
              cp dist/assets/*.css "$DIR/assets/" || echo "Failed to copy CSS to $DIR/assets/"
            fi
          done
          
          # Create a backup of the original HTML files
          mkdir -p dist/backup
          find dist -name "*.html" -exec cp {} dist/backup/ \;
          echo "Created backup of HTML files in dist/backup/"
          
          # DO NOT modify the HTML structure - only add the CSS link
          find dist -name "*.html" -type f | while read -r file; do
            # Check if file has a head tag
            if grep -q "<head" "$file"; then
              echo "Adding CSS link to $file"
              # Add CSS link before the closing head tag without removing existing CSS
              sed -i 's|</head>|<link rel="stylesheet" href="/assets/_slug_.D4Tn2_qj.css">\n  </head>|g' "$file"
            else
              echo "WARNING: No head tag in $file"
              # Copy from backup since we might have corrupted the file
              cp "dist/backup/$(basename "$file")" "$file"
            fi
          done
          
          # Print the first 50 lines of index.html for debugging
          echo "First 50 lines of index.html:"
          head -n 50 dist/index.html || echo "index.html not found or empty"
          
          # Debug info
          echo "CSS file distribution:"
          find dist -name "*.css" | sort
          
          echo "CSS references in HTML files:"
          find dist -name "*.html" -exec grep -l "stylesheet" {} \; | xargs grep "stylesheet" || echo "No stylesheet references found"
          
          echo "CSS path fix complete"

      - name: Add .nojekyll file
        run: |
          touch dist/.nojekyll
          echo "Added .nojekyll file to disable Jekyll processing"
          
      - name: Copy CNAME file and create image compatibility links
        run: |
          echo "craiggoble.com" > dist/CNAME
          echo "Added CNAME file for custom domain"
          
          # Create compatibility directories for old image paths
          mkdir -p dist/pages/cgoble/portfolio/pictures
          
          # Copy images from their new locations to support old references
          if [ -f "public/images/blog/nanoleaf/nana_leaf_circuit.png" ]; then
            cp public/images/blog/nanoleaf/nana_leaf_circuit.png dist/pages/cgoble/portfolio/pictures/
            echo "Copied nanoleaf circuit image for compatibility"
          fi
          
          if [ -f "public/images/blog/nanoleaf/nano_leaf_finial.jpg" ]; then
            cp public/images/blog/nanoleaf/nano_leaf_finial.jpg dist/pages/cgoble/portfolio/pictures/
            echo "Copied nanoleaf finial image for compatibility"
          fi
          
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder the action should deploy
          branch: gh-pages # The branch the action should deploy to
          clean: true # Automatically remove deleted files from the deployment branch