name: Build and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies 📦
        run: npm ci

      - name: Build site 🏗️
        run: npm run build

      - name: Fix CSS paths 🔧
        run: |
          echo "Fixing CSS paths in HTML files..."
          find docs -name "*.html" -exec sed -i 's|href="/_astro/|href="./assets/|g' {} \;
          mkdir -p docs/assets
          cp docs/_astro/* docs/assets/ || echo "No assets to copy"
          echo "CSS path fix complete"

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs # The folder the action should deploy
          branch: gh-pages # The branch the action should deploy to
          clean: true # Automatically remove deleted files from the deployment branch