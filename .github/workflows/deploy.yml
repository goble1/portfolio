name: Build and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies 📦
        run: npm ci

      - name: Build site 🏗️
        run: npm run build

      - name: Fix CSS paths 🔧
        run: |
          echo "Fixing CSS paths in HTML files..."
          # Fix all references to _astro CSS files
          find docs -name "*.html" -exec sed -i 's|href="/_astro/|href="./assets/|g' {} \;
          # Fix direct references to _slug_ CSS file at root
          find docs -name "*.html" -exec sed -i 's|href="/_slug_|href="./assets/_slug_|g' {} \;
          # Create assets directory and copy all CSS files
          mkdir -p docs/assets
          cp -r docs/_astro/* docs/assets/ || echo "No _astro files to copy"
          # Copy any CSS files in root to assets directory
          find docs -maxdepth 1 -name "*.css" -exec cp {} docs/assets/ \; || echo "No root CSS files to copy"
          echo "CSS path fix complete"

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs # The folder the action should deploy
          branch: gh-pages # The branch the action should deploy to
          clean: true # Automatically remove deleted files from the deployment branch